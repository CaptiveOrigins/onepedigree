name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Leak check (emails and build output; private terms are only checked locally)
        run: bash scripts/leak-check.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same order as the Release workflow: packages read each other's source, so nothing needs building first.
      # (Building first here once hid a package that only typechecked against built output; alpha.19's release failed.)
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
