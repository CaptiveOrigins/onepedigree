# OnePedigree for Mac: on a desktop-v* tag, build a universal (Apple silicon + Intel)
# app, sign its update with the updater key, and publish a GitHub release with
# latest.json, which installed apps check for updates.
# Secrets: TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if set).
# Apple notarization (APPLE_* secrets) can be added later; until then macOS asks
# people to confirm the first launch (right-click > Open).
name: Desktop app

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @captiveorigins/onepedigree-core --filter @captiveorigins/onepedigree-react run build
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'OnePedigree for Mac ${{ github.ref_name }}'
          releaseBody: 'Download the .dmg below. Installed apps update themselves (you can turn that off in Settings).'
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
          includeUpdaterJson: true
